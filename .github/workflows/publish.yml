name: Publish to crates.io

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  WHISPER_DONT_GENERATE_BINDINGS: "1"

jobs:
  publish:
    if: github.event.release.prerelease == false && startsWith(github.event.release.tag_name, 'v')
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) doesn't match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Version verified: $CARGO_VERSION"

      - name: Run tests
        run: cargo test --locked --features transcription

      - name: Check if version exists on crates.io
        id: check_version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          curl -fsSL --retry 4 https://index.crates.io/lu/ci/lucid-core -o "$RUNNER_TEMP/lucid-index.jsonl"
          if jq --slurp --exit-status --arg v "$VERSION" 'any(.[]; .vers == $v)' "$RUNNER_TEMP/lucid-index.jsonl" > /dev/null; then
            echo "Version $VERSION already exists on crates.io, skipping publish"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION not found on crates.io, will publish"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to crates.io
        if: steps.check_version.outputs.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p lucid-core
